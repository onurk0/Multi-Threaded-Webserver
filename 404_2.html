<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    h1 {
      color: #333;
    }

    video {
      margin-top: 20px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    /* Fullscreen overlay button */
    #startOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 999;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1> Error 404: Page not found!</h1>

  <video id="myVideo" width="360" height="240" controls>
    <source src="video.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Invisible overlay to trigger user interaction -->
  <div id="startOverlay"></div>

  <script>
    const video = document.getElementById('myVideo');
    const overlay = document.getElementById('startOverlay');

    // Wait for user to click anywhere on overlay
    overlay.addEventListener('click', () => {
      video.play().then(() => {
        video.muted = false; // ensure sound is on
      }).catch(err => console.log("Autoplay failed:", err));

      // Hide overlay so it doesn't block interaction
      overlay.style.display = 'none';
    });
  </script>
</body>

</html>
